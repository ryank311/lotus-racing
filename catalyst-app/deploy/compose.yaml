services:
  catalyst:
    image: ${CATALYST_IMAGE:-ghcr.io/ryank311/catalyst-coach:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      CATALYST_SERVER_DATA_DIR: /data
      TZ: America/New_York
    ports:
      # Only the NAS itself can reach this port; Tailscale Serve provides HTTPS.
      - "127.0.0.1:3210:3210"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
