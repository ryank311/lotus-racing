services:
  catalyst:
    image: ${CATALYST_IMAGE:-ghcr.io/ryank311/catalyst-coach:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      CATALYST_SERVER_DATA_DIR: /data
      TZ: America/New_York
    ports:
      # Local access only; Cloudflare Tunnel or Tailscale provides remote HTTPS.
      - "127.0.0.1:${CATALYST_HTTP_PORT:-3210}:3210"
    volumes:
      - type: bind
        source: ${CATALYST_NAS_DATA_DIR:-/volume1/docker/catalyst-coach/data}
        target: /data
        bind:
          # A typo must fail instead of silently creating an empty workspace.
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
