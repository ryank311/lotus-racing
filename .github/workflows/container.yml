# Installed at repository root: .github/workflows/container.yml
name: Container image

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'catalyst-app/**'
      - 'tracks/**'
      - 'Lotus/**'
      - 'Vette/**'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'catalyst-app/**'
      - 'tracks/**'
      - 'Lotus/**'
      - 'Vette/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/catalyst-coach
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - name: Build and publish Linux image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: catalyst-app/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image reference
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### Catalyst Coach image' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
